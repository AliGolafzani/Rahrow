# Local development only. No application, staging, or production topology.
services:
  postgres:
    image: postgres:18.6-bookworm
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
      POSTGRES_DB: ${POSTGRES_DB:?Set the local database name}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set a local database port}:5432"
    volumes:
      # PostgreSQL 18 uses /var/lib/postgresql/18/docker beneath this mount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      com.rahrow.environment: local
      com.rahrow.component: postgres

volumes:
  postgres-data:
    labels:
      com.rahrow.environment: local
      com.rahrow.component: postgres
